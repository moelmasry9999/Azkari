if(!localStorage.getItem("adhkar_daily_progress")){
 const oldCounts = JSON.parse(localStorage.getItem("adhkar_progress") || "{}");
 if(Object.keys(oldCounts).length){
  allDailyCounts[todayKey] = oldCounts;
  localStorage.setItem("adhkar_daily_progress",JSON.stringify(allDailyCounts));
 }
}
let counts = allDailyCounts[todayKey] || {};

function getData(){
 if(page === "morning") return morning;
 if(page === "evening") return evening;
 return extraSections[page] || [];
}

function save(){
 allDailyCounts[todayKey] = counts;
 localStorage.setItem("adhkar_daily_progress",JSON.stringify(allDailyCounts));
}

function render(){
 const container = document.getElementById("adhkar");
 const trackerView = document.getElementById("trackerView");
 const intro = document.getElementById("intro");
 const progressBox = document.getElementById("progressBox");
 const resetBtn = document.getElementById("resetBtn");

 if(page === "prayerTimes"){
  intro.style.display = "none";
  progressBox.style.display = "none";
  container.style.display = "none";
  resetBtn.style.display = "none";
  trackerView.style.display = "none";
  document.getElementById("prayerTimesView").style.display = "block";
  renderPrayerTimesPanel();
  return;
 }
 document.getElementById("prayerTimesView").style.display = "none";

 if(page === "tracker"){
  intro.style.display = "none";
  progressBox.style.display = "none";
  container.style.display = "none";
  resetBtn.style.display = "none";
  trackerView.style.display = "block";
  renderTracker();
  return;
 }

 intro.style.display = "";
 progressBox.style.display = "";
 container.style.display = "";
 trackerView.style.display = "none";
 resetBtn.style.display = "";

 const data = getData();
 container.innerHTML = "";
 const pageNames = {
  morning:"☀️ أذكار الصباح", evening:"🌙 أذكار المساء", sleep:"🌙 أذكار النوم",
  wake:"🌅 أذكار الاستيقاظ", home:"🏠 أذكار دخول المنزل والخروج منه",
  toilet:"🚪 أذكار الخلاء", food:"🍽️ أذكار الطعام", mosque:"🕌 أذكار المسجد",
  prayer:"🤲 أذكار بعد الصلاة", distress:"💚 أذكار الكرب والهم"
 };
 document.getElementById("pageTitle").textContent = pageNames[page] || "أذكاري";
 const subtitles = {sleep:"اختم يومك بذكر الله",wake:"ابدأ يومك بحمد الله",home:"اذكر الله عند دخولك وخروجك",toilet:"أذكار الدخول والخروج",food:"سمِّ الله واحمده على رزقه",mosque:"أذكار دخول المسجد والخروج منه",prayer:"أذكار ثابتة بعد الصلوات المفروضة",distress:"أدعية من القرآن والسنة عند الهم والكرب"};
 document.querySelector("#intro p").textContent = subtitles[page] || "ابدأ يومك بذكر الله ❤️";

 data.forEach((item,index)=>{

  const key = page + "_" + index;
  const current = counts[key] ?? item.count;
  const done = current === 0;

  const card = document.createElement("div");
  card.className = "card" + (done ? " done" : "");

  // الزر أول عنصر ليظهر على اليمين

  const btn = document.createElement("button");
  btn.className = "counter";
  btn.textContent = done ? "✓" : current;
  btn.setAttribute("aria-label","العدد المتبقي للذكر");

  btn.disabled = done;

  btn.onclick = ()=>increment(index);

  const content = document.createElement("div");
  content.className = "content";

  const number = document.createElement("div");
  number.className = "number";
  number.textContent =
   (index+1) + " - " + item.title;

  const dhikr = document.createElement("div");
  dhikr.className = "dhikr";
  dhikr.textContent = item.text;

  const details = document.createElement("div");
  details.className = "details";
  details.textContent =
   "التكرار: " + item.count + " مرات | المصدر: " + item.source;

  content.append(number,dhikr,details);

  card.append(btn,content);

  container.appendChild(card);

 });

 updateProgress();
}

function increment(index){

 const key = page + "_" + index;

 if(counts[key] === undefined){
  counts[key] = getData()[index].count;
 }

 if(counts[key] > 0){
  counts[key]--;
  save();
  render();
 }
}

function changePage(newPage){

 page = newPage;

 document.getElementById("morningBtn")
 .classList.toggle("active",page==="morning");

 document.getElementById("eveningBtn")
 .classList.toggle("active",page==="evening");

 document.querySelectorAll("nav button").forEach(btn=>btn.classList.remove("active"));
 const activeButton = document.getElementById(page+"Btn");
 if(activeButton) activeButton.classList.add("active");

 render();

 window.scrollTo({top:0,behavior:"smooth"});
}

function updateProgress(){

 const data = getData();

 const total = data.length;

 const completed = data.filter((item,index)=>{
  const key = page + "_" + index;
  const remaining = counts[key] ?? item.count;
  return remaining === 0;
 }).length;

 const percent = Math.round(completed/total*100);

 document.getElementById("percentage").textContent =
 percent + "%";

 document.getElementById("fill").style.width =
 percent + "%";

 document.getElementById("status").textContent =
 "أكملت " + completed + " من " + total +
 " ذكر — المتبقي " + (total-completed);
}

function resetPage(){

 if(confirm("هل تريد إعادة عدادات هذه الصفحة؟")){

  getData().forEach((item,index)=>{
   delete counts[page+"_"+index];
  });

  save();
  render();
 }
}


function dayLabel(date){
 return new Intl.DateTimeFormat("ar-EG",{weekday:"long",year:"numeric",month:"long",day:"numeric"}).format(date);
}
function dayCompletion(dayData,list,prefix){
 if(!dayData) return "unrecorded";
 let completed=0, started=false;
 list.forEach((item,index)=>{
  const key=prefix+"_"+index;
  const remaining=dayData[key] ?? item.count;
  if(dayData[key] !== undefined) started=true;
  if(remaining===0) completed++;
 });
 if(completed===list.length) return "done";
 if(started || completed>0) return "partial";
 return "unrecorded";
}
function statusText(status){
 return {done:"مكتملة ✓",partial:"بدأت ولم تكتمل",unrecorded:"غير مسجلة"}[status];
}
function renderTracker(){
 const box=document.getElementById("trackerView");
 const today=new Date();
 const days=[];
 let fullDays=0,morningDone=0,eveningDone=0,recordedDays=0,extraSectionDone=0;
 for(let i=0;i<30;i++){
  const d=new Date(today.getFullYear(),today.getMonth(),today.getDate()-i);
  const key=localDateKey(d), data=allDailyCounts[key];
  const m=dayCompletion(data,morning,"morning");
  const e=dayCompletion(data,evening,"evening");
  if(m==="done") morningDone++;
  if(e==="done") eveningDone++;
  if(m==="done" && e==="done") fullDays++;
  const extras=Object.entries(extraSections).map(([section,list])=>({section,status:dayCompletion(data,list,section)}));
  extraSectionDone += extras.filter(x=>x.status==="done").length;
  if(data) recordedDays++;
  days.push({date:d,key,m,e,extras});
 }
 const rate=Math.round(fullDays/30*100);
 box.innerHTML=`
  <div class="intro"><h2>📅 المتابعة اليومية</h2><p>تابع إنجاز أذكار الصباح والمساء يومًا بيوم</p></div>
  <div class="tracker-summary">
   <div class="tracker-grid">
    <div class="tracker-stat"><strong>${fullDays}</strong><span>أيام اكتملت فيها أذكار الصباح والمساء</span></div>
    <div class="tracker-stat"><strong>${rate}%</strong><span>نسبة الأيام المكتملة خلال آخر 30 يومًا</span></div>
    <div class="tracker-stat"><strong>${morningDone}</strong><span>مرات إكمال أذكار الصباح</span></div>
    <div class="tracker-stat"><strong>${eveningDone}</strong><span>مرات إكمال أذكار المساء</span></div>
    <div class="tracker-stat"><strong>${extraSectionDone}</strong><span>مرات إكمال الأقسام الإضافية</span></div>
   </div>
   <div class="progress-info"><span>الأيام التي بدأ فيها تسجيل التقدم</span><span>${recordedDays}/30</span></div>
   <div class="bar"><div class="fill" style="width:${Math.round(recordedDays/30*100)}%"></div></div>
   <p class="tracker-note">يُسجل الإكمال تلقائيًا عند إنهاء جميع أذكار القسم. الأيام التي لم تستخدم فيها الموقع تظهر «غير مسجلة»، ولا نفترض أنك لم تقرأ فيها الأذكار.</p>
  </div>
  <h3>سجل آخر 30 يومًا</h3>
  ${days.map((item,index)=>{
   const mc=item.m==="done"?"done":item.m==="partial"?"partial":"unrecorded";
   const ec=item.e==="done"?"done":item.e==="partial"?"partial":"unrecorded";
   const label=index===0?"اليوم":index===1?"أمس":dayLabel(item.date);
   return `<div class="day-row"><div class="day-title">${label}</div><div class="day-status">
    <span>☀️ الصباح: <b class="status-pill ${mc}">${statusText(item.m)}</b></span>
    <span>🌙 المساء: <b class="status-pill ${ec}">${statusText(item.e)}</b></span>
   </div>
   <div class="day-status" style="margin-top:10px">${item.extras.map(x=>{
    const cls=x.status==="done"?"done":x.status==="partial"?"partial":"unrecorded";
    const names={sleep:"النوم",wake:"الاستيقاظ",home:"المنزل",toilet:"الخلاء",food:"الطعام",mosque:"المسجد",prayer:"بعد الصلاة",distress:"الكرب"};
    return `<span>${names[x.section]}: <b class="status-pill ${cls}">${statusText(x.status)}</b></span>`;
   }).join("")}</div></div>`;
  }).join("")}
 `;
}


// مواقيت الشروق والغروب والتنبيه قبل كل منهما بنصف ساعة
const PRAYER_API = "https://api.aladhan.com/v1";
const PRAYER_METHOD_EGYPT = 5; // الهيئة المصرية العامة للمساحة
let prayerTimesData = null;
let prayerLocationLabel = localStorage.getItem("azkari_prayer_location_label") || "";
let prayerCoordinates = JSON.parse(localStorage.getItem("azkari_prayer_coordinates") || "null");
let prayerCity = localStorage.getItem("azkari_prayer_city") || "";
let prayerAlarmTimer = null;

function renderPrayerTimesPanel(){
 const el=document.getElementById("prayerTimesView");
 if(!el) return;
 el.innerHTML=`
  <h2>🕰️ مواقيت الشروق والغروب</h2>
  <p>احسب مواقيت اليوم حسب موقعك، واضبط تنبيهًا قبل الشروق وقبل الغروب بنصف ساعة.</p>
  <div class="action-row">
   <button onclick="useDeviceLocation()">📍 تحديد موقعي تلقائيًا</button>
   <button onclick="enablePrayerNotifications()">🔔 تفعيل إشعارات المتصفح</button>
  </div>
  <div class="action-row">
   <input id="prayerCityInput" placeholder="اكتب مدينتك، مثل: أبو حماد" value="${escapePrayerHtml(prayerCity)}">
   <button onclick="loadPrayerTimesByCity()">استخدام المدينة</button>
  </div>
  <div id="prayerLocationStatus" class="muted">${prayerLocationLabel ? 'الموقع المحفوظ: '+escapePrayerHtml(prayerLocationLabel) : 'لم يتم تحديد الموقع بعد.'}</div>
  <div id="prayerTimesResult"><p class="muted">حدد موقعك أو اكتب اسم مدينتك لعرض المواقيت.</p></div>
  <div class="notice">مهم: التنبيه التلقائي يعمل ما دامت صفحة أذكاري مفتوحة في المتصفح. إذا أغلقت الصفحة أو المتصفح فلن نضمن وصول الإشعار؛ الإشعارات المضمونة أثناء إغلاق الموقع تحتاج إلى استضافة HTTPS وخدمة Push خلفية.</div>
  <p class="muted">مصدر الحساب: AlAdhan API، مع اختيار طريقة الهيئة المصرية العامة للمساحة. قد تختلف الدقائق عن تقويم المسجد أو الجهة الرسمية المحلية؛ راجع التقويم المعتمد في منطقتك.</p>`;
 if(prayerCoordinates) fetchPrayerTimes(prayerCoordinates.lat,prayerCoordinates.lon,prayerLocationLabel || 'موقعي');
 else if(prayerCity) fetchPrayerTimesByCity(prayerCity);
}
function escapePrayerHtml(value){return String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function useDeviceLocation(){
 const status=document.getElementById('prayerLocationStatus');
 if(!navigator.geolocation){status.textContent='المتصفح لا يدعم تحديد الموقع. اكتب اسم مدينتك بدلًا من ذلك.';return;}
 status.textContent='جارٍ تحديد موقعك… وافق على طلب الموقع من المتصفح.';
 navigator.geolocation.getCurrentPosition(pos=>{
  const coords={lat:pos.coords.latitude,lon:pos.coords.longitude};
  prayerCoordinates=coords; prayerCity=''; prayerLocationLabel='موقعك الحالي';
  localStorage.setItem('azkari_prayer_coordinates',JSON.stringify(coords));
  localStorage.removeItem('azkari_prayer_city');
  localStorage.setItem('azkari_prayer_location_label',prayerLocationLabel);
  fetchPrayerTimes(coords.lat,coords.lon,prayerLocationLabel);
 },err=>{status.textContent=err.code===1?'لم تسمح بإذن الموقع. يمكنك كتابة اسم المدينة يدويًا.':'تعذر تحديد الموقع. اكتب اسم المدينة يدويًا.';},{enableHighAccuracy:false,timeout:12000,maximumAge:3600000});
}
async function loadPrayerTimesByCity(){
 const input=document.getElementById('prayerCityInput');
 const city=(input?.value||'').trim();
 if(!city){alert('اكتب اسم المدينة أولًا.');return;}
 prayerCity=city; prayerCoordinates=null; prayerLocationLabel=city+', مصر';
 localStorage.setItem('azkari_prayer_city',city);localStorage.removeItem('azkari_prayer_coordinates');localStorage.setItem('azkari_prayer_location_label',prayerLocationLabel);
 await fetchPrayerTimesByCity(city);
}
async function fetchPrayerTimesByCity(city){
 const box=document.getElementById('prayerTimesResult');
 if(box)box.innerHTML='<p class="muted">جارٍ تحميل مواقيت الصلاة…</p>';
 try{
  const now=new Date(); const date=[String(now.getDate()).padStart(2,'0'),String(now.getMonth()+1).padStart(2,'0'),now.getFullYear()].join('-');
  const url=`${PRAYER_API}/timingsByCity/${date}?city=${encodeURIComponent(city)}&country=Egypt&method=${PRAYER_METHOD_EGYPT}`;
  const response=await fetch(url); if(!response.ok)throw new Error('تعذر الاتصال بمصدر المواقيت');
  const json=await response.json(); if(json.code!==200)throw new Error('لم يتم العثور على مواقيت لهذه المدينة');
  showPrayerTimes(json.data.timings,city+', مصر');
 }catch(e){if(box)box.innerHTML=`<p>تعذر جلب المواقيت: ${escapePrayerHtml(e.message)}. تحقق من اسم المدينة والاتصال بالإنترنت.</p>`;}
}
async function fetchPrayerTimes(lat,lon,label){
 const box=document.getElementById('prayerTimesResult');
 if(box)box.innerHTML='<p class="muted">جارٍ تحميل مواقيت الصلاة…</p>';
 try{
  const now=new Date(); const date=[String(now.getDate()).padStart(2,'0'),String(now.getMonth()+1).padStart(2,'0'),now.getFullYear()].join('-');
  const url=`${PRAYER_API}/timings/${date}?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&method=${PRAYER_METHOD_EGYPT}`;
  const response=await fetch(url); if(!response.ok)throw new Error('تعذر الاتصال بمصدر المواقيت');
  const json=await response.json(); if(json.code!==200)throw new Error('تعذر حساب المواقيت لهذا الموقع');
  showPrayerTimes(json.data.timings,label);
 }catch(e){if(box)box.innerHTML=`<p>تعذر جلب المواقيت: ${escapePrayerHtml(e.message)}. جرّب كتابة اسم المدينة.</p>`;}
}
function parsePrayerClock(value){
 const match=String(value||'').match(/(\d{1,2}):(\d{2})/); if(!match)return null;
 const d=new Date();d.setHours(Number(match[1]),Number(match[2]),0,0);return d;
}
function showPrayerTimes(times,label){
 prayerTimesData=times;
 const sunrise=parsePrayerClock(times.Sunrise), sunset=parsePrayerClock(times.Sunset||times.Maghrib);
 if(!sunrise||!sunset){document.getElementById('prayerTimesResult').innerHTML='<p>لم تصل بيانات الشروق والغروب بشكل صحيح.</p>';return;}
 const morningReminder=new Date(sunrise.getTime()-30*60000), eveningReminder=new Date(sunset.getTime()-30*60000);
 const fmt=d=>d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
 document.getElementById('prayerTimesResult').innerHTML=`
  <div class="time-grid">
   <div class="time-card">🌅 الشروق<strong>${escapePrayerHtml(times.Sunrise)}</strong></div>
   <div class="time-card">☀️ تذكير أذكار الصباح<strong>${fmt(morningReminder)}</strong><span class="muted">قبل الشروق بنصف ساعة</span></div>
   <div class="time-card">🌇 الغروب<strong>${escapePrayerHtml(times.Sunset||times.Maghrib)}</strong></div>
   <div class="time-card">🌙 تذكير أذكار المساء<strong>${fmt(eveningReminder)}</strong><span class="muted">قبل الغروب بنصف ساعة</span></div>
  </div>
  <p class="muted">الموقع: ${escapePrayerHtml(label)} | طريقة الحساب: الهيئة المصرية العامة للمساحة | تاريخ اليوم: ${new Date().toLocaleDateString('ar-EG')}</p>`;
 document.getElementById('prayerLocationStatus').textContent='الموقع المستخدم: '+label;
 schedulePrayerAlerts(morningReminder,eveningReminder);
}
async function enablePrayerNotifications(){
 if(!('Notification' in window)){alert('هذا المتصفح لا يدعم إشعارات الويب.');return;}
 const permission=await Notification.requestPermission();
 if(permission==='granted'){
  alert('تم السماح بالإشعارات. اترك صفحة أذكاري مفتوحة ليعمل التذكير في موعده.');
  if(prayerTimesData){const sunrise=parsePrayerClock(prayerTimesData.Sunrise),sunset=parsePrayerClock(prayerTimesData.Sunset||prayerTimesData.Maghrib);schedulePrayerAlerts(new Date(sunrise-1800000),new Date(sunset-1800000));}
 }else alert('لم يتم السماح بالإشعارات. يمكنك تفعيلها من إعدادات الموقع في المتصفح.');
}
function schedulePrayerAlerts(morningTime,eveningTime){
 if(prayerAlarmTimer)clearInterval(prayerAlarmTimer);
 const check=()=>{
  const now=new Date();
  [[morningTime,'morning','حان وقت أذكار الصباح 🌅','باقي نصف ساعة على الشروق، ابدأ أذكار الصباح.'],[eveningTime,'evening','حان وقت أذكار المساء 🌇','باقي نصف ساعة على الغروب، ابدأ أذكار المساء.']].forEach(([target,kind,title,body])=>{
   const key='azkari_alert_'+kind+'_'+localDateKey();
   const delta=now-target;
   if(delta>=0&&delta<5*60000&&!localStorage.getItem(key)){
    localStorage.setItem(key,'1');
    if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body,tag:key});
    else alert(title+'\n'+body);
   }
  });
 };
 check();prayerAlarmTimer=setInterval(check,20000);
}

render();

</script>

</body>
</html>
